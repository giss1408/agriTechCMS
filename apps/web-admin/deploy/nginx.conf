# Serves the built web app (dist/). Tuned for slow links: compressed transfers, long-lived immutable
# assets, revalidated HTML. The API is served separately (or proxied below).
server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 860;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;
  gzip_static on;  # serves dist/*.gz when present

  # Hashed file names: safe to cache for a year, never re-downloaded.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # SPA routes (/producers/…, /trace/…) all serve index.html, always revalidated.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  # Optional same-origin API (saves the CORS preflight round-trip on every call):
  # location /v1/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
}
